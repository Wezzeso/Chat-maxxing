[package]
name = "relay"
version = "0.3.4"
edition = "2021"
description = "A small native Rust messaging app with GTK and WebKitGTK"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
